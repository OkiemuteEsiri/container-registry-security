name: security-quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile source
        run: python -m compileall -q src
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Synthetic assessment smoke test
        run: |
          python -m src.cli data/synthetic_registry_inventory.json --output /tmp/assessment.md
          test -s /tmp/assessment.md
          grep -q "Container Registry Security Assessment" /tmp/assessment.md
